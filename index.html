<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Reisekosten App</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#121212">
    <!-- Chart.js for Pie Charts -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Dexie.js from CDN for IndexedDB -->
    <script src="https://unpkg.com/dexie@3.2.4/dist/dexie.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- html2pdf for PDF export -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header class="app-header" style="display: flex; justify-content: space-between; align-items: center;">
            <h1 id="header-title" style="display:flex; align-items:center; gap:8px;">
                <i data-lucide="plane-takeoff" style="width:24px;height:24px;"></i> Reisekosten-App
            </h1>
            <div class="theme-switch-wrapper">
                <label class="theme-switch" for="theme-checkbox">
                    <input type="checkbox" id="theme-checkbox" />
                    <div class="slider round">
                        <i data-lucide="sun" class="icon-sun"></i>
                        <i data-lucide="moon" class="icon-moon"></i>
                    </div>
                </label>
            </div>
        </header>

        <!-- Main Content Area -->
        <main class="content-area">
            <!-- VIEW: HOME -->
            <section id="view-home" class="view active">
                <div class="card form-card">
                    <h2>Neue Ausgabe</h2>
                    <form id="expense-form">
                        <div class="input-group">
                            <label for="trip-select">Reise</label>
                            <select id="trip-select" required>
                                <option value="" disabled selected>Reise wählen...</option>
                            </select>
                        </div>
                        <div class="input-group">
                            <label for="category-select">Kategorie</label>
                            <select id="category-select" required>
                                <option value="" disabled selected>Kategorie wählen...</option>
                            </select>
                        </div>
                        <div class="input-group">
                            <label for="expense-amount">Betrag (€)</label>
                            <input type="number" id="expense-amount" step="0.01" placeholder="0.00" required>
                        </div>
                        <div class="input-group">
                            <label for="expense-date">Datum</label>
                            <input type="date" id="expense-date" required>
                        </div>
                        <div class="input-group">
                            <label for="expense-note">Notiz (Optional)</label>
                            <input type="text" id="expense-note" placeholder="z.B. Abendessen">
                        </div>
                        <div class="input-group">
                            <label for="expense-photo" style="display:flex; align-items:center; gap:8px;">
                                <i data-lucide="camera" style="width:18px;height:18px;"></i> Beleg / Foto (Optional)
                            </label>
                            <input type="file" id="expense-photo" accept="image/*" capture="environment">
                        </div>
                        <button type="submit" class="btn-primary">Speichern</button>
                    </form>
                </div>
                
                <div class="card list-card">
                    <h2>Letzte Eingaben</h2>
                    <div id="recent-expenses-list" class="list-container">
                        <!-- Expenses will be populated here -->
                    </div>
                </div>
            </section>

            <!-- VIEW: EDIT -->
            <section id="view-edit" class="view">
                <div class="tabs">
                    <button class="tab-btn active" data-target="tab-trips">Reisen</button>
                    <button class="tab-btn" data-target="tab-categories">Kategorien</button>
                    <button class="tab-btn" data-target="tab-entries">Einträge</button>
                </div>

                <div id="tab-trips" class="tab-content active">
                    <div class="card form-card">
                        <h3>Neue Reise</h3>
                        <form id="trip-form">
                            <div class="input-group">
                                <input type="text" id="trip-name" placeholder="Name der Reise" required>
                            </div>
                            <button type="submit" class="btn-primary">Hinzufügen</button>
                        </form>
                    </div>
                    <div class="list-container" id="trips-list"></div>
                </div>

                <div id="tab-categories" class="tab-content">
                    <div class="card form-card">
                        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
                            <h3 style="margin: 0;">Neue Kategorie</h3>
                            <button id="btn-restore-cats" class="btn-primary" style="width: auto; padding: 6px 12px; font-size: 0.8rem; background: var(--text-secondary); box-shadow: none;"><i data-lucide="refresh-cw" style="width:14px;height:14px;margin-right:4px;vertical-align:middle;"></i> Standard wiederherstellen</button>
                        </div>
                        <form id="category-form">
                            <div class="input-group">
                                <input type="text" id="category-group" placeholder="Überkategorie (z.B. Reise)" required>
                            </div>
                            <div class="input-group">
                                <input type="text" id="category-name" placeholder="Unterkategorie (z.B. Zug)" required>
                            </div>
                            <button type="submit" class="btn-primary">Hinzufügen</button>
                        </form>
                    </div>
                    <div class="list-container" id="categories-list"></div>
                </div>

                <div id="tab-entries" class="tab-content">
                    <div class="list-container" id="all-entries-list"></div>
                </div>
            </section>

            <!-- VIEW: STATS -->
            <section id="view-stats" class="view">
                <div class="card form-card">
                    <h2>Bericht & Export</h2>
                    <div class="input-group">
                        <label for="stats-trip-select">Reise auswählen</label>
                        <select id="stats-trip-select">
                            <option value="" disabled selected>Reise wählen...</option>
                        </select>
                    </div>
                    <div class="input-group">
                        <label for="stats-mode-select">Ansicht</label>
                        <select id="stats-mode-select">
                            <option value="complete">Komplettansicht</option>
                            <option value="group-main">Nach Überkategorien</option>
                            <option value="group-sub">Nach Unterkategorien</option>
                        </select>
                    </div>
                    <div class="input-group">
                        <label for="stats-sort-select">Sortierung</label>
                        <select id="stats-sort-select">
                            <option value="date-desc">Datum (neueste zuerst)</option>
                            <option value="date-asc">Datum (älteste zuerst)</option>
                            <option value="cost-desc">Kosten (höchste zuerst)</option>
                            <option value="cost-asc">Kosten (niedrigste zuerst)</option>
                        </select>
                    </div>
                    <button id="btn-export-pdf" class="btn-primary" style="margin-top: 10px; background-color: #10b981; color: white;">
                        <i data-lucide="download" style="width:18px;height:18px;vertical-align:middle;margin-right:8px;"></i> Als PDF exportieren
                    </button>
                </div>

                <!-- Report Container (styled for light mode printing) -->
                <div class="card" style="background-color: #ffffff; color: #000000; padding: 20px; overflow-x: auto;">
                    <div id="stats-report-content" style="min-width: 300px;">
                        <div class="empty-state" style="color: #64748b;">
                            <i data-lucide="bar-chart-2" class="empty-icon"></i>
                            <h2>Keine Reise gewählt</h2>
                            <p>Bitte wählen Sie oben eine Reise aus.</p>
                        </div>
                    </div>
                </div>
            </section>
            <!-- Footer inside scrollable area -->
            <div class="app-footer">
                <p>&copy; Christian Schuster | 2026</p>
                <p style="display:flex; align-items:center; gap:4px; font-weight: 500; justify-content: center;">
                    <i data-lucide="rocket" style="width: 14px; height: 14px; color: var(--primary-color);"></i> with Antigravity
                </p>
            </div>
        </main>

        <!-- Bottom Navigation -->
        <nav class="bottom-nav">
            <button class="nav-item active" data-view="view-home">
                <i data-lucide="plus-circle"></i>
                <span>Erfassen</span>
            </button>
            <button class="nav-item" data-view="view-edit">
                <i data-lucide="settings-2"></i>
                <span>Verwalten</span>
            </button>
            <button class="nav-item" data-view="view-stats">
                <i data-lucide="pie-chart"></i>
                <span>Statistik</span>
            </button>
        </nav>

        <!-- Photo Modal -->
        <div id="photo-modal" style="display:none; position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,0.9); z-index:100; justify-content:center; align-items:center; flex-direction:column;">
            <button id="close-modal" style="position:absolute; top:20px; right:20px; background:none; border:none; color:white; cursor:pointer;"><i data-lucide="x" style="width:32px;height:32px;"></i></button>
            <img id="modal-image" src="" style="max-width:90%; max-height:80%; border-radius:8px; object-fit:contain;">
        </div>
    </div>

    <!-- Scripts -->
    <script src="db.js"></script>
    <script src="app.js"></script>
    <script>
        // Register Service Worker
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js')
            .then(reg => console.log('Service Worker registered', reg))
            .catch(err => console.error('Service Worker registration failed', err));
        }
    </script>
</body>
</html>
